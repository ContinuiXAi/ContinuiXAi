name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, chatgpt-development, continuixai-ops-ci-integration, fix-empty-db-pilot-bootstrap, fix/admin-site-authorization-consistency]
  pull_request:
    branches: [master, chatgpt-development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prisma Generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npm run prisma:generate -w apps/api
      - name: Run Build
        env:
          BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prisma Generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npm run prisma:generate -w apps/api
      - name: Run Tests
        run: npm run test

  database-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: continuixai_ops
          POSTGRES_PASSWORD: continuixai_ops
          POSTGRES_DB: continuixai_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U continuixai_ops -d continuixai_ops_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://continuixai_ops:continuixai_ops@localhost:5432/continuixai_ops_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build shared workspace package used by real API routes
        working-directory: .
        run: npm run build -w packages/shared
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply all migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Confirm migration history is current
        run: npx prisma migrate status
      - name: Confirm migrated database matches schema.prisma exactly
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema=prisma/schema.prisma
      - name: Validate populated count-assignment migration safety
        run: npx tsx scripts/countAssignmentMigrationValidation.ts
      - name: Validate populated multi-site membership backfill
        run: npx tsx scripts/siteMembershipBackfillValidation.ts
      - name: Exercise first-user bootstrap on a fresh PostgreSQL database
        run: npx tsx scripts/freshPilotBootstrapValidation.ts
      - name: Exercise the real Store Count HTTP route on PostgreSQL
        run: npx tsx scripts/storeCountRouteValidation.ts
      - name: Reject cross-site Store Count access inside one organization
        run: npx tsx scripts/storeCountSiteAuthorizationValidation.ts
      - name: Reject accidental completion of an empty Count
        run: npx tsx scripts/emptyCountCompletionValidation.ts
      - name: Validate commercial tenant and append-only ledger integrity
        run: npx tsx scripts/commercialFoundationValidation.ts
      - name: Validate versioned product composition concurrency and rollback
        run: npx tsx scripts/productCompositionDbValidation.ts
      - name: Validate count review baselines and immutable evidence on PostgreSQL
        run: npx tsx scripts/inventoryTruthReviewDbValidation.ts
      - name: Validate final count assignment evidence and cancellation races on PostgreSQL
        run: npx tsx scripts/inventoryTruthFinalDbValidation.ts
      - name: Validate point-in-time inventory history on PostgreSQL
        env:
          INVENTORY_HISTORY_DB_VALIDATE: "1"
        run: npx tsx scripts/inventoryHistoryDbValidation.ts
      - name: Validate role-based task scoping and recurrence idempotency
        run: npx tsx scripts/taskFoundationValidation.ts
      - name: Exercise atomic counting and idempotent retries on PostgreSQL
        run: npx tsx scripts/storeCountDbValidation.ts
